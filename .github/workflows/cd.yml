name: CD - Package images (A2-25)

# API image can be published before a production API URL exists (bootstrap).
# Web image embeds the API URL at build time and therefore remains gated.
# Publishing images is NOT proof of a production deployment.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a2-25-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-quality:
    name: CD / API quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brewlite
      JWT_SECRET: ci-only-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install API dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint API
        run: npm run lint
      - name: Run API unit tests
        run: npm test -- --runInBand
      - name: Build API
        run: npm run build

  web-quality:
    name: CD / Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Lint web
        run: npm run lint
      - name: Build web
        run: npm run build

  docker-build-check:
    name: CD / Dockerfiles build check (PR)
    if: ${{ github.event_name == 'pull_request' }}
    needs: [api-quality, web-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate API Dockerfile (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
      - name: Validate Web Dockerfile (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000

  release-configuration:
    name: CD / Release configuration
    needs: [api-quality, web-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unit test Render deployment adapter (offline)
        run: python3 -m unittest discover -s scripts/cd -p test_render_release.py
      - name: Check production API origin for web image
        env:
          PROD_API_PUBLIC_URL: ${{ vars.PROD_API_PUBLIC_URL }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "PR build validation only; registry publishing is disabled on pull requests." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$PROD_API_PUBLIC_URL" ]; then
            echo '::notice::A2-25: API image will publish to GHCR. Web image waits for PROD_API_PUBLIC_URL.'
            echo 'API image: publication enabled; Web image: waiting for A2-26 HTTPS API URL.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Production API origin provided; both image publications are enabled.' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: CD / GHCR publish (SHA)
    # Bootstrap API first; never publish Web with a localhost API URL.
    if: ${{ github.event_name != 'pull_request' }}
    needs: [api-quality, web-quality, release-configuration]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    outputs:
      api_name: ${{ steps.image-tags.outputs.api_name }}
      web_name: ${{ steps.image-tags.outputs.web_name }}
      api_digest: ${{ steps.api-image.outputs.digest }}
      web_digest: ${{ steps.web-image.outputs.digest }}
    env:
      PROD_API_PUBLIC_URL: ${{ vars.PROD_API_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approved ref and public HTTPS origin
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/* && "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::CD publication is allowed only on main or an approved version tag.'
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
              echo '::error::Version tag must reference a commit already on main.'
              exit 1
            }
          fi
          if [[ -n "$PROD_API_PUBLIC_URL" ]]; then
            case "$PROD_API_PUBLIC_URL" in
              https://*) ;;
              *) echo '::error::PROD_API_PUBLIC_URL must start with https://.'; exit 1 ;;
            esac
            case "$PROD_API_PUBLIC_URL" in
              *localhost*|*127.0.0.1*|*.invalid*|*example.com*|*example.org*)
                echo '::error::PROD_API_PUBLIC_URL must be a real public HTTPS API origin.'
                exit 1 ;;
            esac
            echo 'Public HTTPS API origin validated; both images will publish.'
          else
            echo 'API-only bootstrap: public API origin is not known yet; Web publication deferred.'
          fi

      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image names and immutable SHA tags
        id: image-tags
        shell: bash
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          api="ghcr.io/${repo_lc}-api"
          web="ghcr.io/${repo_lc}-web"
          sha_tag="sha-${GITHUB_SHA:0:12}"
          api_tags="${api}:${sha_tag}"
          web_tags="${web}:${sha_tag}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            api_tags="${api_tags}"$'\n'"${api}:${GITHUB_REF_NAME}"
            web_tags="${web_tags}"$'\n'"${web}:${GITHUB_REF_NAME}"
          fi
          {
            echo "api_name=$api"
            echo "web_name=$web"
            echo "api_tags<<API_TAGS_EOF"
            printf '%s\n' "$api_tags"
            echo 'API_TAGS_EOF'
            echo "web_tags<<WEB_TAGS_EOF"
            printf '%s\n' "$web_tags"
            echo 'WEB_TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish API image
        id: api-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image-tags.outputs.api_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish Web image
        if: ${{ env.PROD_API_PUBLIC_URL != '' }}
        id: web-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.image-tags.outputs.web_tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PROD_API_PUBLIC_URL }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record published immutable image digests
        env:
          API_NAME: ${{ steps.image-tags.outputs.api_name }}
          WEB_NAME: ${{ steps.image-tags.outputs.web_name }}
          API_DIGEST: ${{ steps.api-image.outputs.digest }}
          WEB_DIGEST: ${{ steps.web-image.outputs.digest }}
        shell: bash
        run: |
          {
            echo '## A2-25: GHCR image publication'
            echo ''
            echo "- Git commit: \`$GITHUB_SHA\`"
            echo "- API image: \`$API_NAME@$API_DIGEST\`"
            if [[ -n "$WEB_DIGEST" ]]; then
              echo "- Web image: \`$WEB_NAME@$WEB_DIGEST\`"
            else
              echo '- Web image: not published (PROD_API_PUBLIC_URL is not configured).'
            fi
            echo ''
            echo 'Publishing alone does not prove deployment. See the guarded CD / Render deploy by digest + smoke job.'
            echo 'Render deploy is gated by RENDER_DEPLOY_ENABLED and an A2-27 migration sign-off for this commit.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: CD / Render deploy by digest + smoke
    # Deliberately disabled until the owner has approved production configuration.
    if: ${{ github.ref == 'refs/heads/main' && vars.RENDER_DEPLOY_ENABLED == 'true' }}
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.PROD_WEB_PUBLIC_URL }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
      RENDER_WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
      PROD_API_PUBLIC_URL: ${{ vars.PROD_API_PUBLIC_URL }}
      PROD_WEB_PUBLIC_URL: ${{ vars.PROD_WEB_PUBLIC_URL }}
      API_IMAGE: ${{ needs.publish.outputs.api_name }}@${{ needs.publish.outputs.api_digest }}
      WEB_IMAGE: ${{ needs.publish.outputs.web_name }}@${{ needs.publish.outputs.web_digest }}
      MIGRATION_APPROVED_SHA: ${{ vars.A2_27_MIGRATION_APPROVED_SHA }}
      A225_EVIDENCE_DIR: work/A2-25/evidence
    steps:
      - uses: actions/checkout@v4
      - name: Validate release config and A2-27 migration approval
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_API_KEY" ]]; then
            echo '::error::Set secret RENDER_API_KEY in GitHub Actions.'; exit 1
          fi
          if [[ "$MIGRATION_APPROVED_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::A2-27 migration sign-off missing for this exact commit. Set A2_27_MIGRATION_APPROVED_SHA to the full main SHA after schema review.'; exit 1
          fi
          for setting in RENDER_API_SERVICE_ID RENDER_WEB_SERVICE_ID PROD_API_PUBLIC_URL PROD_WEB_PUBLIC_URL; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing GitHub Actions Variable $setting"; exit 1
            fi
          done
          if [[ "$API_IMAGE" != ghcr.io/*@sha256:* || "$WEB_IMAGE" != ghcr.io/*@sha256:* ]]; then
            echo '::error::Both published immutable GHCR image digests are required.'; exit 1
          fi
          echo '## A2-25: production release' >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\` (A2-27 migration review confirmed)" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy API exact image digest and wait for Live
        shell: bash
        run: |
          python3 scripts/cd/render_release.py deploy \
            --service "$RENDER_API_SERVICE_ID" --image "$API_IMAGE" --label api

      - name: Smoke API after deployment
        shell: bash
        run: |
          python3 scripts/cd/render_release.py smoke --api-url "$PROD_API_PUBLIC_URL"

      - name: Deploy Web exact image digest and wait for Live
        shell: bash
        run: |
          python3 scripts/cd/render_release.py deploy \
            --service "$RENDER_WEB_SERVICE_ID" --image "$WEB_IMAGE" --label web

      - name: Smoke Web and API after deployment
        shell: bash
        run: |
          python3 scripts/cd/render_release.py smoke \
            --api-url "$PROD_API_PUBLIC_URL" --web-url "$PROD_WEB_PUBLIC_URL"

      - name: Upload non-secret deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: a2-25-render-release-evidence
          path: work/A2-25/evidence/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Show rollback procedure on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          echo '::error::A2-25 production release failed; do not claim Done.'
          echo '## Recovery' >> "$GITHUB_STEP_SUMMARY"
          echo '1. Inspect the two Render deployment histories and find the last successful image digests.' >> "$GITHUB_STEP_SUMMARY"
          echo '2. Use Render Deploys -> Rollback for the affected services; verify API /health, /products and Web /.' >> "$GITHUB_STEP_SUMMARY"
          echo '3. Do not roll back PostgreSQL schema blindly. Coordinate with Khoa (A2-27).' >> "$GITHUB_STEP_SUMMARY"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1460" style="width: 100%; height: auto; max-width: 1900px" role="img" aria-labelledby="title desc">
  <title id="title">BrewLite - Sơ đồ use case tổng quan</title>
  <desc id="desc">Sơ đồ use case cho khách hàng, nhân viên vận hành và quản trị viên; bao gồm đặt hàng, khuyến mãi, điểm thưởng, thanh toán VNPay Sandbox, tồn kho và vận hành đơn hàng.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52685d"/></marker>
    <marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#52685d" stroke-width="1.5"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #24352e; }
      .title { font-size: 30px; font-weight: 700; }
      .boundary-label { font-size: 20px; font-weight: 700; }
      .actor-label { font-size: 17px; font-weight: 600; text-anchor: middle; }
      .usecase { fill: #f4f7f5; stroke: #315b4a; stroke-width: 2; }
      .uc-label { font-size: 16px; text-anchor: middle; }
      .association { fill: none; stroke: #52685d; stroke-width: 1.8; }
      .include { fill: none; stroke: #52685d; stroke-width: 1.8; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .extend { fill: none; stroke: #52685d; stroke-width: 1.8; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .relation-label { font-size: 14px; fill: #53665b; paint-order: stroke; stroke: #fbfcfa; stroke-width: 4px; stroke-linejoin: round; }
      .note { fill: #fff7df; stroke: #b7892c; stroke-width: 1.5; }
      .note-text { font-size: 14px; }
    </style>
  </defs>
  <rect width="1900" height="1460" fill="#ffffff"/>
  <text class="title" x="950" y="54" text-anchor="middle">BrewLite - Sơ đồ use case tổng quan</text>
  <rect x="270" y="100" width="1330" height="1250" rx="8" fill="#fbfcfa" stroke="#315b4a" stroke-width="2.5"/>
  <text class="boundary-label" x="935" y="137" text-anchor="middle">Hệ thống đặt hàng BrewLite</text>

  <g class="association">
    <path d="M 176 520 L 230 520 L 230 200 L 390 200"/>
    <path d="M 176 520 L 250 520 L 250 310 L 390 310"/>
    <path d="M 176 520 L 270 520 L 270 420 L 390 420"/>
    <path d="M 176 520 L 290 520 L 290 530 L 390 530"/>
    <path d="M 176 520 L 300 520 L 300 640 L 390 640"/>
    <path d="M 176 520 L 310 520 L 310 770 L 390 770"/>
    <path d="M 176 520 L 320 520 L 320 900 L 390 900"/>
    <path d="M 176 520 L 240 520 L 240 1020 L 390 1020"/>
    <path d="M 176 520 L 225 520 L 225 260 L 830 260"/>
    <path d="M 176 1165 L 235 1165 L 235 1135 L 830 1135"/>
    <path d="M 176 1165 L 255 1165 L 255 1260 L 830 1260"/>
    <path d="M 1725 1165 L 1580 1165 L 1580 1135"/>
    <path d="M 1725 1165 L 1580 1165 L 1580 1260"/>
  </g>

  <g class="include">
    <path d="M 750 770 L 830 770"/>
    <path d="M 1010 295 L 1010 345"/>
    <path d="M 1010 415 L 1010 475"/>
    <path d="M 1010 545 L 1010 605"/>
  </g>
  <g class="extend">
    <path d="M 570 675 L 570 735"/>
    <path d="M 830 900 L 790 900 L 790 260 L 830 260"/>
    <path d="M 830 1010 L 770 1010 L 770 260 L 830 260"/>
    <path d="M 1220 815 L 1190 678"/>
  </g>
  <text class="relation-label" x="790" y="755" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
  <text class="relation-label" x="620" y="713">&lt;&lt;extend&gt;&gt;</text>
  <text class="relation-label" x="1030" y="325">&lt;&lt;include&gt;&gt;</text>
  <text class="relation-label" x="1030" y="458">&lt;&lt;include&gt;&gt;</text>
  <text class="relation-label" x="1030" y="588">&lt;&lt;include&gt;&gt;</text>
  <text class="relation-label" x="795" y="575">&lt;&lt;extend&gt;&gt;</text>
  <text class="relation-label" x="775" y="700">&lt;&lt;extend&gt;&gt;</text>
  <text class="relation-label" x="1197" y="735">&lt;&lt;extend&gt;&gt; [PAID]</text>

  <g class="usecase-nodes">
    <ellipse class="usecase" cx="570" cy="200" rx="180" ry="38"/><text class="uc-label" x="570" y="206">Xem menu</text>
    <ellipse class="usecase" cx="570" cy="310" rx="180" ry="38"/><text class="uc-label" x="570" y="305"><tspan x="570">Xem chi tiết sản phẩm</tspan><tspan x="570" dy="20">và tùy chọn</tspan></text>
    <ellipse class="usecase" cx="570" cy="420" rx="180" ry="38"/><text class="uc-label" x="570" y="426">Đăng ký / đăng nhập</text>
    <ellipse class="usecase" cx="570" cy="530" rx="180" ry="38"/><text class="uc-label" x="570" y="536">Quản lý giỏ hàng</text>
    <ellipse class="usecase" cx="570" cy="640" rx="180" ry="38"/><text class="uc-label" x="570" y="635"><tspan x="570">Xem trước / áp dụng</tspan><tspan x="570" dy="20">mã khuyến mãi</tspan></text>
    <ellipse class="usecase" cx="570" cy="770" rx="180" ry="38"/><text class="uc-label" x="570" y="776">Tạo đơn hàng</text>
    <ellipse class="usecase" cx="570" cy="900" rx="180" ry="38"/><text class="uc-label" x="570" y="895"><tspan x="570">Xem lịch sử và</tspan><tspan x="570" dy="20">trạng thái đơn</tspan></text>
    <ellipse class="usecase" cx="570" cy="1020" rx="180" ry="38"/><text class="uc-label" x="570" y="1015"><tspan x="570">Xem hồ sơ và</tspan><tspan x="570" dy="20">số dư điểm</tspan></text>

    <ellipse class="usecase" cx="1010" cy="260" rx="180" ry="38"/><text class="uc-label" x="1010" y="255"><tspan x="1010">Thanh toán VNPay</tspan><tspan x="1010" dy="20">(Sandbox)</tspan></text>
    <ellipse class="usecase" cx="1010" cy="380" rx="180" ry="38"/><text class="uc-label" x="1010" y="375"><tspan x="1010">Xác minh quyền sở hữu,</tspan><tspan x="1010" dy="20">số tiền và idempotency</tspan></text>
    <ellipse class="usecase" cx="1010" cy="510" rx="180" ry="38"/><text class="uc-label" x="1010" y="505"><tspan x="1010">Tạo phiên thanh toán</tspan><tspan x="1010" dy="20">VNPay Sandbox</tspan></text>
    <ellipse class="usecase" cx="1010" cy="640" rx="180" ry="38"/><text class="uc-label" x="1010" y="635"><tspan x="1010">Ghi nhận kết quả và</tspan><tspan x="1010" dy="20">cập nhật trạng thái đơn</tspan></text>
    <ellipse class="usecase" cx="1010" cy="770" rx="180" ry="38"/><text class="uc-label" x="1010" y="765"><tspan x="1010">Kiểm tra giá, khuyến mãi</tspan><tspan x="1010" dy="20">và tồn nguyên liệu</tspan></text>
    <ellipse class="usecase" cx="1010" cy="900" rx="180" ry="38"/><text class="uc-label" x="1010" y="906">Đổi điểm thưởng</text>
    <ellipse class="usecase" cx="1010" cy="1010" rx="180" ry="38"/><text class="uc-label" x="1010" y="1016">Thử lại thanh toán lỗi</text>

    <ellipse class="usecase" cx="1400" cy="815" rx="180" ry="42"/><text class="uc-label" x="1400" y="810"><tspan x="1400">Cộng điểm khi thanh toán</tspan><tspan x="1400" dy="20">thành công (nếu đủ điều kiện)</tspan></text>
    <ellipse class="usecase" cx="1010" cy="1135" rx="180" ry="42"/><text class="uc-label" x="1010" y="1130"><tspan x="1010">Xem đơn và cập nhật</tspan><tspan x="1010" dy="20">trạng thái pha chế</tspan></text>
    <ellipse class="usecase" cx="1010" cy="1260" rx="180" ry="38"/><text class="uc-label" x="1010" y="1266">Tạo đơn bán tại quầy</text>
    <ellipse class="usecase" cx="1400" cy="1135" rx="180" ry="42"/><text class="uc-label" x="1400" y="1130"><tspan x="1400">Quản lý sản phẩm và</tspan><tspan x="1400" dy="20">tồn nguyên liệu</tspan></text>
    <ellipse class="usecase" cx="1400" cy="1260" rx="180" ry="38"/><text class="uc-label" x="1400" y="1266">Quản lý vai trò người dùng</text>
  </g>

  <g class="actors" stroke="#24352e" stroke-width="2.2" fill="none" stroke-linecap="round">
    <circle cx="150" cy="465" r="14"/><path d="M150 479 L150 522 M126 494 L174 494 M150 522 L128 550 M150 522 L172 550"/>
    <circle cx="150" cy="1110" r="14"/><path d="M150 1124 L150 1167 M126 1139 L174 1139 M150 1167 L128 1195 M150 1167 L172 1195"/>
    <circle cx="1750" cy="1110" r="14"/><path d="M1750 1124 L1750 1167 M1726 1139 L1774 1139 M1750 1167 L1728 1195 M1750 1167 L1772 1195"/>
  </g>
  <text class="actor-label" x="150" y="578">Khách hàng</text>
  <text class="actor-label" x="150" y="1225"><tspan x="150">Nhân viên vận hành</tspan><tspan x="150" dy="20">(STAFF / ADMIN)</tspan></text>
  <text class="actor-label" x="1750" y="1225"><tspan x="1750">Quản trị viên</tspan><tspan x="1750" dy="20">(ADMIN)</tspan></text>

  <rect class="note" x="1210" y="330" width="330" height="72" rx="4"/><text class="note-text" x="1225" y="357"><tspan x="1225">Thanh toán qua VNPay Sandbox;</tspan><tspan x="1225" dy="20">đơn chờ IPN xác thực.</tspan></text>
  <rect class="note" x="1210" y="900" width="330" height="70" rx="4"/><text class="note-text" x="1225" y="927"><tspan x="1225">Điểm chỉ cộng sau khi PAID;</tspan><tspan x="1225" dy="20">mỗi đơn cộng tối đa một lần.</tspan></text>
  <text x="300" y="1325" font-size="14" fill="#617168">Đường nét đứt: &lt;&lt;include&gt;&gt; / &lt;&lt;extend&gt;&gt; (mũi tên chỉ quan hệ đích)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="2150" height="1550" viewBox="0 0 2150 1550" role="img" aria-labelledby="title desc">
<title id="title">BrewLite - Use Case checkout VNPay Sandbox</title>
<desc id="desc">Customer creates pending order, starts VNPay payment session, VNPay sends signed IPN that alone can settle payment; retry/cancel and order history.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52685d"/></marker>
<style>
text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#23352d}.title{font-size:31px;font-weight:700}.caption{font-size:17px;font-weight:700}.uc{fill:#f4f7f5;stroke:#315b4a;stroke-width:2}.ok{fill:#ecf7ef;stroke:#42835c;stroke-width:2}.bad{fill:#fff0ed;stroke:#b34e4a;stroke-width:2}.lbl{font-size:16px;text-anchor:middle}.actor{fill:none;stroke:#24372e;stroke-width:3;stroke-linecap:round}.assoc{fill:none;stroke:#52685d;stroke-width:2}.inc{fill:none;stroke:#52685d;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arr)}.notebox{fill:#fff9e7;stroke:#c89d48;stroke-width:1.5}.notetext{font-size:15px}.rel{font-size:14px;fill:#506258;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}
</style></defs>
<rect width="2150" height="1550" fill="#fff"/>
<text class="title" x="1075" y="57" text-anchor="middle">BrewLite - Use Case: Đặt hàng và thanh toán VNPay Sandbox</text>
<rect x="252" y="90" width="1660" height="1400" rx="11" fill="#fbfcfb" stroke="#315b4a" stroke-width="2.4"/>
<text class="caption" x="1082" y="128" text-anchor="middle">BrewLite Web + API</text>
<path class="assoc" d="M183 680 L390 250"/>
<path class="assoc" d="M183 705 L365 800"/>
<path class="assoc" d="M183 732 L390 986"/>
<path class="assoc" d="M183 750 L1310 1200"/>
<path class="assoc" d="M2037 790 L1790 790"/>
<path class="inc" d="M733 250L835 188"/>
<path class="inc" d="M733 250L835 295"/>
<path class="inc" d="M733 250L835 400"/>
<path class="inc" d="M733 250L835 505"/>
<path class="inc" d="M733 250L835 609"/>
<path class="inc" d="M752 803L837 745"/>
<path class="inc" d="M1344 795L1350 907"/>
<path class="inc" d="M1342 815L1116 906"/>
<path class="inc" d="M560 355 L560 301"/>
<path class="inc" d="M560 936L560 851"/>
<path class="inc" d="M740 1116L959 951"/>
<path class="inc" d="M1120 1107L1089 951"/>
<text class="rel" x="748" y="205">«include»</text>
<text class="rel" x="750" y="287">«include»</text>
<text class="rel" x="762" y="372">«include»</text>
<text class="rel" x="762" y="470">«include»</text>
<text class="rel" x="766" y="565">«include»</text>
<text class="rel" x="752" y="765">«include»</text>
<text class="rel" x="1348" y="865">«include»</text>
<text class="rel" x="1165" y="853">«include»</text>
<text class="rel" x="566" y="342">«extend»</text>
<text class="rel" x="570" y="901">«extend»</text>
<text class="rel" x="825" y="1024">«extend»</text>
<text class="rel" x="1125" y="1030">«extend»</text>
<ellipse class="uc" cx="560" cy="250" rx="176" ry="52"/>
<text class="lbl" x="560" y="239" style="font-size:16px">Đặt hàng từ giỏ</text>
<text class="lbl" x="560" y="262" style="font-size:16px">POST /orders</text>
<ellipse class="uc" cx="1050" cy="188" rx="213" ry="42"/>
<text class="lbl" x="1050" y="177" style="font-size:16px">Xác thực JWT, hồ sơ</text>
<text class="lbl" x="1050" y="200" style="font-size:16px">và số dư điểm</text>
<ellipse class="uc" cx="1050" cy="295" rx="213" ry="42"/>
<text class="lbl" x="1050" y="284" style="font-size:16px">Kiểm tra giỏ, sản phẩm,</text>
<text class="lbl" x="1050" y="307" style="font-size:16px">size và topping</text>
<ellipse class="uc" cx="1050" cy="400" rx="213" ry="42"/>
<text class="lbl" x="1050" y="389" style="font-size:16px">Tính giá, xác nhận</text>
<text class="lbl" x="1050" y="412" style="font-size:16px">khuyến mãi phía server</text>
<ellipse class="uc" cx="1050" cy="505" rx="213" ry="42"/>
<text class="lbl" x="1050" y="494" style="font-size:16px">Kiểm tra và trừ tồn</text>
<text class="lbl" x="1050" y="517" style="font-size:16px">trong transaction</text>
<ellipse class="uc" cx="1050" cy="609" rx="213" ry="42"/>
<text class="lbl" x="1050" y="598" style="font-size:16px">Tạo Order / OrderItem</text>
<text class="lbl" x="1050" y="621" style="font-size:16px">PENDING</text>
<ellipse class="uc" cx="560" cy="404" rx="190" ry="44"/>
<text class="lbl" x="560" y="404" style="font-size:16px">Xem trước mã khuyến mãi</text>
<ellipse class="uc" cx="560" cy="803" rx="195" ry="53"/>
<text class="lbl" x="560" y="792" style="font-size:16px">Tạo phiên VNPay Sandbox</text>
<text class="lbl" x="560" y="815" style="font-size:16px">POST /payments: PENDING</text>
<ellipse class="uc" cx="1050" cy="745" rx="213" ry="48"/>
<text class="lbl" x="1050" y="734" style="font-size:16px">Kiểm tra sở hữu, số tiền,</text>
<text class="lbl" x="1050" y="757" style="font-size:16px">điểm và Idempotency-Key</text>
<ellipse class="uc" cx="1570" cy="790" rx="217" ry="54"/>
<text class="lbl" x="1570" y="779" style="font-size:16px">Nhận signed VNPay IPN</text>
<text class="lbl" x="1570" y="802" style="font-size:16px">GET /payments/webhooks/vnpay</text>
<ellipse class="uc" cx="1570" cy="932" rx="217" ry="48"/>
<text class="lbl" x="1570" y="921" style="font-size:16px">Xác minh chữ ký, merchant,</text>
<text class="lbl" x="1570" y="944" style="font-size:16px">mã giao dịch và số tiền</text>
<ellipse class="uc" cx="1080" cy="932" rx="232" ry="47"/>
<text class="lbl" x="1080" y="921" style="font-size:16px">Chốt Payment và cập nhật</text>
<text class="lbl" x="1080" y="944" style="font-size:16px">trạng thái đơn hàng</text>
<ellipse class="uc" cx="560" cy="986" rx="190" ry="50"/>
<text class="lbl" x="560" y="975" style="font-size:16px">Thử lại PAYMENT_FAILED</text>
<text class="lbl" x="560" y="998" style="font-size:16px">Idempotency-Key mới</text>
<ellipse class="ok" cx="570" cy="1145" rx="236" ry="68"/>
<text class="lbl" x="570" y="1123" style="font-size:15px">SUCCESS → PAID</text>
<text class="lbl" x="570" y="1146" style="font-size:15px">Điểm được xử lý một lần;</text>
<text class="lbl" x="570" y="1169" style="font-size:15px">xóa đúng dòng giỏ đã mua</text>
<ellipse class="bad" cx="1100" cy="1145" rx="230" ry="68"/>
<text class="lbl" x="1100" y="1134" style="font-size:15px">FAILED → PAYMENT_FAILED</text>
<text class="lbl" x="1100" y="1157" style="font-size:15px">Giữ giỏ, cho phép thử lại</text>
<ellipse class="uc" cx="1570" cy="1115" rx="210" ry="48"/>
<text class="lbl" x="1570" y="1104" style="font-size:16px">Xem trạng thái / lịch sử</text>
<text class="lbl" x="1570" y="1127" style="font-size:16px">GET /orders/me</text>
<ellipse class="uc" cx="1570" cy="1220" rx="210" ry="52"/>
<text class="lbl" x="1570" y="1209" style="font-size:16px">Hủy đơn PENDING/FAILED</text>
<text class="lbl" x="1570" y="1232" style="font-size:16px">POST /orders/:id/cancel</text>
<g class="actor"><circle cx="155" cy="615" r="16"/><path d="M155 631v53m-29 -37h58m-29 37l-26 35m26 -35l26 35"/></g>
<text x="155" y="745" style="font-size:17px;font-weight:700" text-anchor="middle">Khách hàng</text>
<text x="155" y="766" style="font-size:17px;font-weight:700" text-anchor="middle">CUSTOMER</text>
<g class="actor"><circle cx="2010" cy="705" r="16"/><path d="M2010 721v53m-29 -37h58m-29 37l-26 35m26 -35l26 35"/></g>
<text x="2010" y="835" style="font-size:17px;font-weight:700" text-anchor="middle">VNPay Sandbox</text>
<text x="2010" y="856" style="font-size:17px;font-weight:700" text-anchor="middle">IPN có chữ ký</text>
<rect class="notebox" x="285" y="1320" width="744" height="134" rx="5"/>
<text class="notetext" x="303" y="1348">Tạo đơn: kiểm tra JWT, giá, mã giảm, tồn; trừ tồn trong transaction.</text>
<text class="notetext" x="303" y="1371">Thanh toán thất bại chưa tự hoàn tồn; hủy đơn hoặc timeout có thể hoàn tồn.</text>
<text class="notetext" x="303" y="1394">Retry phải do khách chủ động nhấn; tạo idempotency key mới.</text>
<rect class="notebox" x="1050" y="1320" width="816" height="134" rx="5"/>
<text class="notetext" x="1068" y="1348">POST /payments chỉ tạo phiên PENDING cùng checkoutUrl.</text>
<text class="notetext" x="1068" y="1371">Chỉ signed VNPay IPN được cập nhật Order/Payment; browser return không được.</text>
<text class="notetext" x="1068" y="1394">IPN giả mạo / sai số tiền bị từ chối; callback lặp không chốt lại.</text>
</svg>
